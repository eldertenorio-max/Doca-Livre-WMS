# Blueprint Render — Doca Livre WMS PRO UNIFICADO (100% nativo no Render, sem depender de domínio externo)
#
# Produção:    branch main    → https://doca-livre-wms-pro.onrender.com
# Homologação: branch homolog → https://doca-livre-wms-pro-homologacao.onrender.com

services:
  # ── Produção ──────────────────────────────────────────────────────────────
  - type: web
    name: doca-livre-wms-pro
    env: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT --workers 1 --timeout 120 --graceful-timeout 30 --worker-class gthread --threads 4 app:app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: producao
      - key: SECRET_KEY
        generateValue: true
      - key: SSO_SECRET
        sync: false
      - key: PORTAL_PUBLIC_URL
        value: https://doca-livre-wms-pro.onrender.com/
      - key: SYSTEM_URL_LIGHT
        value: https://doca-livre-wms-pro.onrender.com/contagem
      - key: SYSTEM_URL_PLUS
        value: https://doca-livre-wms-pro.onrender.com/camaras
      - key: SYSTEM_URL_PRO
        value: https://doca-livre-wms-pro.onrender.com/painel
      - key: PGSSLMODE
        value: require
      - key: DATABASE_URL
        value: postgresql://ofertacargaadmin:P44oEgrDjcRDmxdxsWA0IJN9AEvKduOEaA1@psql-ofertacarga-prod.postgres.database.azure.com:5432/wmspro?sslmode=require
      - key: HUB_API_URL
        sync: false
      - key: RAVEX_USER
        sync: false
      - key: RAVEX_PASSWORD
        sync: false

  # ── Homologação ───────────────────────────────────────────────────────────
  - type: web
    name: doca-livre-wms-pro-homologacao
    env: python
    plan: free
    region: oregon
    branch: homolog
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT --workers 1 --timeout 120 --graceful-timeout 30 --worker-class gthread --threads 4 app:app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: homologacao
      - key: SECRET_KEY
        generateValue: true
      - key: SSO_SECRET
        sync: false
      - key: PORTAL_PUBLIC_URL
        value: https://doca-livre-wms-pro-homologacao.onrender.com/
      - key: SYSTEM_URL_LIGHT
        value: https://doca-livre-wms-pro-homologacao.onrender.com/contagem
      - key: SYSTEM_URL_PLUS
        value: https://doca-livre-wms-pro-homologacao.onrender.com/camaras
      - key: SYSTEM_URL_PRO
        value: https://doca-livre-wms-pro-homologacao.onrender.com/painel
      - key: PGSSLMODE
        value: require
      - key: DATABASE_URL
        value: postgresql://ofertacargaadmin:P44oEgrDjcRDmxdxsWA0IJN9AEvKduOEaA1@psql-ofertacarga-prod.postgres.database.azure.com:5432/wmspro?sslmode=require
      - key: HUB_API_URL
        sync: false
      - key: RAVEX_USER
        sync: false
      - key: RAVEX_PASSWORD
        sync: false
