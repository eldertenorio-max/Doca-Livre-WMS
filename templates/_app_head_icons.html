<link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}?v=20261109b" sizes="192x192" type="image/png">
<link rel="icon" href="{{ url_for('static', filename='icons/favicon-32x32.png') }}?v=20261109b" sizes="32x32" type="image/png">
<link rel="icon" href="{{ url_for('static', filename='icons/favicon.ico') }}?v=20261109b" sizes="any">
